services:
  - type: web
    name: t-app-backend
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate --schema prisma/schema.prisma && npm run build
    preDeployCommand: npx prisma migrate deploy --schema prisma/schema.prisma
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_SERVICE_TIMEOUT_MS
        value: "30000"
